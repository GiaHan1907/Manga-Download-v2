[package]
name = "manga-downloader-1989"
version = "1.0.1"
edition = "2021"

[lib]
name = "manga_downloader_1989_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
async-trait = "0.1"
percent-encoding = "2"
btls = "=0.5.6"
tokio-btls = "=0.5.6"
rustls-native-certs = "0.8"
base64 = "0.22"
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["tokio-rt", "form", "webpki-roots"] }
wreq-util = "=3.0.0-rc.14"
scraper = "0.23"
regex = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "net", "io-util"] }
flate2 = "1.1.10"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
