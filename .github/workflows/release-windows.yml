name: Release Windows (staging)

# Builds a traceable NSIS installer from a TAGGED commit and stores it as a
# staging artifact with a manifest. This workflow NEVER publishes: no GitHub
# Release creation, no upload to any external destination, no signing.
# Publication is a separate, explicitly owner-authorized human action
# (Phase 10 plan P10-10 / state machine). Requires the protected
# `release-staging` environment (manual approval) once repo environments are
# configured by the owner.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Re-pin actions to commit SHAs before public distribution (see ci.yml note).

jobs:
  release-candidate:
    runs-on: windows-latest
    environment: release-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version invariant + tag agreement
        shell: pwsh
        run: |
          node scripts/check-version.mjs
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "${env:GITHUB_REF_NAME}".TrimStart('v')
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $tag -ne $conf) {
            Write-Error "tag v$tag != tauri.conf version $conf"; exit 1
          }
      - name: Full gates (release-blocking)
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          cd src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ..
      - name: Build NSIS x64 installer
        run: npm run tauri build -- --bundles nsis
      - name: Manifest (commit, version, size, SHA-256, signing status)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "artifact=$($exe.Name)`nsize=$($exe.Length)`nsha256=$hash`ncommit=$env:GITHUB_SHA`nversion=v$ver`ntag=${env:GITHUB_REF_NAME}`nsigning=UNSIGNED (no authorized certificate exists as of this phase)" |
            Set-Content ARTIFACT_MANIFEST.txt
          Get-Content ARTIFACT_MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ARTIFACT_MANIFEST.txt
          if-no-files-found: error
      # Intentionally NO softprops/action-gh-release, NO deploy, NO signing.
